plugins {
    id 'com.android.application'
}

android {
    namespace 'com.notoo.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.notoo.app"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "3.0.0"
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            // Side-loadable release build. Replace with your own keystore
            // (or configure signing in CI secrets) before publishing to a store.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
