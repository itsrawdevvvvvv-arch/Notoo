plugins {
    id 'com.android.application'
}

// A stable keystore is decoded into android/notoo-release.p12 by CI from the
// NOTOO_KEYSTORE_B64 secret. When it is absent (e.g. a local build) we fall
// back to the throwaway debug key so the build still works.
def ksFile = file('../notoo-release.p12')
def hasKs = ksFile.exists()

android {
    namespace 'com.notoo.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.notoo.app"
        minSdk 26
        targetSdk 34
        versionCode 6
        versionName "3.7.0"
    }

    signingConfigs {
        release {
            if (hasKs) {
                storeFile ksFile
                storePassword System.getenv("NOTOO_STORE_PW") ?: "notoo-release"
                keyAlias System.getenv("NOTOO_KEY_ALIAS") ?: "notoo"
                keyPassword System.getenv("NOTOO_KEY_PW") ?: "notoo-release"
            }
        }
    }

    buildTypes {
        debug {
            if (hasKs) { signingConfig signingConfigs.release }
        }
        release {
            minifyEnabled false
            if (hasKs) { signingConfig signingConfigs.release }
            else { signingConfig signingConfigs.debug }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
