name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          # The ubuntu runner already ships the Android SDK; just accept licences
          # and make sure the platform we compile against is present.
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=$SDK"
          SM="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          echo "sdkmanager=$SM"
          if [ -n "$SM" ]; then
            yes | "$SM" --licenses > /dev/null 2>&1 || true
            "$SM" "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null 2>&1 || true
          fi
          echo "sdk.dir=$SDK" > android/local.properties
          ls "$SDK/platforms" || true

      - name: Install the signing key
        env:
          KEYSTORE_B64: ${{ secrets.NOTOO_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > android/notoo-release.p12
            echo "Wrote release keystore ($(wc -c < android/notoo-release.p12) bytes)."
          else
            echo "::warning::NOTOO_KEYSTORE_B64 is not set — builds will use a throwaway key and cannot update an existing install."
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Bundle the web app into the APK
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html
          cp manifest.webmanifest android/app/src/main/assets/ 2>/dev/null || true
          cp icon.svg android/app/src/main/assets/ 2>/dev/null || true

      - name: Build APKs
        working-directory: android
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p out
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} out/ \;
          cd out && for f in *.apk; do mv "$f" "Notoo-$f"; done
          ls -la

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: notoo-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Attach APKs to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          name: Notoo ${{ github.ref_name }}
          body: |
            ## Notoo — Notes & Canvas

            An offline notes app with a real infinite canvas.

            ### Install
            1. Download **Notoo-app-release.apk** below.
            2. On your phone, allow installing apps from your browser when prompted
               (Settings → Apps → Special access → Install unknown apps).
            3. Open the file and install.

            `Notoo-app-debug.apk` is the same app built with debug symbols — handy if
            something misbehaves, since it can be attached to a debugger.

            Both APKs share the package name `com.notoo.app` and a stable signing key,
            so each new release installs straight over the previous one and keeps your
            notes.
