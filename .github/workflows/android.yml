name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Bundle the web app into the APK
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html
          cp manifest.webmanifest android/app/src/main/assets/ 2>/dev/null || true
          cp icon.svg android/app/src/main/assets/ 2>/dev/null || true

      - name: Build APKs
        working-directory: android
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p out
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} out/ \;
          cd out && for f in *.apk; do mv "$f" "Notoo-$f"; done
          ls -la

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: notoo-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Attach APKs to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          name: Notoo ${{ github.ref_name }}
          body: |
            ## Notoo — Notes & Canvas

            An offline notes app with a real infinite canvas.

            ### Install
            1. Download **Notoo-app-release.apk** below.
            2. On your phone, allow installing apps from your browser when prompted
               (Settings → Apps → Special access → Install unknown apps).
            3. Open the file and install.

            `Notoo-app-debug.apk` is a debug build — it installs alongside the release
            build under a separate package name, handy for testing.

            The release APK is signed with the standard Android debug key so it can be
            side-loaded. It is not signed for Play Store distribution.
