name: Build Notoo APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install stable signing key
        env:
          KEYSTORE_B64: ${{ secrets.NOTOO_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$HOME/.android/debug.keystore"
            echo "Installed stable signing keystore."
          else
            echo "WARNING: no NOTOO_KEYSTORE_B64 secret; signature will not be stable."
          fi

      - name: Generate Android platform files
        run: |
          flutter create --platforms=android --org com.notoo --project-name notoo /tmp/notoo_scaffold
          cp -r /tmp/notoo_scaffold/android ./android

      - name: Set minSdk 28 and compileSdk 36
        run: |
          FILE=$(ls android/app/build.gradle.kts android/app/build.gradle 2>/dev/null | head -n1)
          echo "Gradle file: $FILE"
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 28/' "$FILE" || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 28/' "$FILE" || true
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' "$FILE" || true
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' "$FILE" || true
          grep -nE "minSdk|compileSdk" "$FILE" || true

      - name: Disable Impeller (fix black screen on some GPUs)
        run: |
          MF=android/app/src/main/AndroidManifest.xml
          sed -i 's#</application>#        <meta-data android:name="io.flutter.embedding.android.EnableImpeller" android:value="false" />\n    </application>#' "$MF" || true
          grep -n "Impeller" "$MF" || true

      - name: Fetch bundled fonts
        run: python3 tool/fetch_fonts.py

      - name: Fetch bundled stickers
        run: python3 tool/fetch_stickers.py

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze || true

      - name: Build release APKs (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Rename APKs and write checksums
        run: |
          cd build/app/outputs/flutter-apk
          mv app-armeabi-v7a-release.apk Notoo-armeabi-v7a.apk || true
          mv app-arm64-v8a-release.apk Notoo-arm64-v8a.apk || true
          mv app-x86_64-release.apk Notoo-x86_64.apk || true
          sha256sum Notoo-*.apk > SHA256SUMS.txt
          ls -la

      - name: Show APK signer certificate
        run: |
          APK=build/app/outputs/flutter-apk/Notoo-arm64-v8a.apk
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* 2>/dev/null | sort -V | tail -n1)
          "$BT"/apksigner verify --print-certs "$APK" 2>/dev/null | head -n 4 || true

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: notoo-apks
          path: |
            build/app/outputs/flutter-apk/Notoo-*.apk
            build/app/outputs/flutter-apk/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            build/app/outputs/flutter-apk/Notoo-*.apk \
            build/app/outputs/flutter-apk/SHA256SUMS.txt \
            --title "Notoo ${GITHUB_REF_NAME}" \
            --notes "Offline, local-first notes for Android 9+. Download an APK below; if unsure, take Notoo-arm64-v8a.apk. Sticker art: Open Doodles (CC0) and Twemoji (CC BY 4.0)." \
            --repo "${GITHUB_REPOSITORY}"
